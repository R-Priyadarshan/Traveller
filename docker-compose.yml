version: '3.8'

services:
  travel-planner:
    build: .
    container_name: travel-planner
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - MAX_RETRIES=3
      - MAX_POIS_PER_DAY=5
      - MAX_HOURS_PER_DAY=10
      - MAX_POIS_TOTAL=30
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  data:
    driver: local

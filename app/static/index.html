<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner - AI Trip Itineraries</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 15px;
            color: #666;
        }

        .results {
            display: none;
        }

        .itinerary-header {
            border-bottom: 3px solid #667eea;
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        .itinerary-header h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .trip-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .info-box strong {
            display: block;
            color: #667eea;
            margin-bottom: 5px;
        }

        .day-plan {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid #764ba2;
        }

        .day-plan h3 {
            color: #764ba2;
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .day-plan .theme {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .day-plan .narrative {
            color: #555;
            line-height: 1.7;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .day-plan .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.9em;
            color: #666;
        }

        .tips {
            background: #e8f5e9;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
            border-left: 4px solid #4caf50;
        }

        .tips h3 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .tips ul {
            list-style: none;
            padding: 0;
        }

        .tips li {
            padding: 8px 0;
            color: #333;
            border-bottom: 1px solid #c8e6c9;
        }

        .tips li:last-child {
            border-bottom: none;
        }

        .error {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }

        .error.show {
            display: block;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .card {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .trip-info {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ Travel Planner</h1>
            <p>AI-powered itinerary generator for your next adventure</p>
        </header>

        <div class="card">
            <div class="error" id="error"></div>

            <div id="form-section">
                <form id="planForm">
                    <div class="form-group">
                        <label for="query">Where do you want to go?</label>
                        <textarea id="query" name="query" placeholder="e.g., 5 days in Tokyo for two people interested in food and culture" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="preferences">Interests (comma-separated)</label>
                            <input type="text" id="preferences" name="preferences" placeholder="e.g., museums, food, hiking, nightlife">
                        </div>

                        <div class="form-group">
                            <label for="budget">Budget Level</label>
                            <select id="budget" name="budget">
                                <option value="low">Budget</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                                <option value="luxury">Luxury</option>
                            </select>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-submit">Generate Itinerary</button>
                        <button type="reset" class="btn-clear">Clear</button>
                    </div>
                </form>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Planning your trip...</p>
            </div>

            <div class="results" id="results"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('planForm');
        const formSection = document.getElementById('form-section');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorDiv = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.classList.remove('show');

            const query = document.getElementById('query').value.trim();
            const preferences = document.getElementById('preferences').value
                .split(',')
                .map(p => p.trim())
                .filter(p => p);
            const budget = document.getElementById('budget').value;

            formSection.style.display = 'none';
            loading.style.display = 'block';
            results.innerHTML = '';

            try {
                const response = await fetch('/api/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, preferences, budget })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to generate itinerary');
                }

                displayResults(data);
            } catch (error) {
                showError(error.message);
                formSection.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        });

        function displayResults(data) {
            let html = `
                <div class="itinerary-header">
                    <h2>Your ${data.n_days}-Day ${data.destination} Itinerary</h2>
                    <p>Generated on ${new Date(data.generated_at).toLocaleDateString()}</p>
                </div>

                <div class="trip-info">
                    <div class="info-box">
                        <strong>📍 Destination</strong>
                        ${data.destination}
                    </div>
                    <div class="info-box">
                        <strong>📅 Duration</strong>
                        ${data.n_days} days
                    </div>
                    <div class="info-box">
                        <strong>💰 Est. Cost</strong>
                        $${data.total_estimated_cost || 'N/A'}
                    </div>
                </div>
            `;

            data.days.forEach(day => {
                html += `
                    <div class="day-plan">
                        <h3>Day ${day.day_number}</h3>
                        <div class="theme">${day.theme}</div>
                        <div class="narrative">${day.narrative}</div>
                        <div class="stats">
                            <span>📍 ${day.pois ? day.pois.length : 0} POIs</span>
                            <span>🚶 ${day.estimated_walking_km} km walking</span>
                        </div>
                    </div>
                `;
            });

            if (data.tips && data.tips.length > 0) {
                html += `
                    <div class="tips">
                        <h3>💡 Travel Tips</h3>
                        <ul>
                            ${data.tips.map(tip => `<li>${tip}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            results.innerHTML = html;
            results.style.display = 'block';

            const backButton = document.createElement('div');
            backButton.style.marginTop = '30px';
            backButton.innerHTML = '<button class="btn-clear" onclick="location.reload()" style="width: 100%;">Plan Another Trip</button>';
            results.appendChild(backButton);
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
    </script>
</body>
</html>
